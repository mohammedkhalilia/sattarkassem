baseURL = 'https://sattarkassem.com/'
title = "Abdul-Sattar Kassem"

defaultContentLanguage = 'ar'
defaultContentLanguageInSubdir = true

enableRobotsTXT = true

[languages]
  [languages.ar]
    label = 'العربية'
    locale = 'ar'
    contentDir = 'content/ar'
    weight = 1
    title = 'عبد الستار قاسم'
    [languages.ar.params]
      direction = 'rtl'

  [languages.en]
    label = 'English'
    locale = 'en'
    contentDir = 'content/en'
    weight = 2
    title = 'Abdul-Sattar Kassem'
    [languages.en.params]
      direction = 'ltr'

[params]
  description = "The archive of the writings, books, and life of Dr. Abdul-Sattar Kassem — Palestinian author, academic, and political figure."

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[permalinks]
  categories = '/articles/category/:slug/'