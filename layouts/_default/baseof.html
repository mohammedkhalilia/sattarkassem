<!doctype html>
<html lang="{{ site.Language.Lang }}" dir="{{ site.Params.direction | default "ltr" }}">
<head>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="site-main{{ with .Params.layout }} site-main--{{ . }}{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
