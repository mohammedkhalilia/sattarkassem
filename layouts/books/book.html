{{ define "main" }}
<article class="single-page book-page">
  <header class="book-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.author }}<p class="book-author">{{ . }}</p>{{ end }}
    {{ with .Params.publish_year }}<p class="book-year">{{ . }}</p>{{ end }}
  </header>
  <div class="book-layout">
    <div class="book-intro content-body">{{ .Content }}</div>
    {{ with .Params.cover }}
      <div class="book-cover-col">
        <img class="book-cover" src="{{ . | relURL }}" alt="{{ $.Title }}">
      </div>
    {{ end }}
  </div>
  {{ with .Pages.ByWeight }}
    {{ with index . 0 }}
      <p class="book-start-reading">
        <a class="book-start-reading-link" href="{{ .RelPermalink }}">{{ T "start_reading" }} &larr;</a>
      </p>
    {{ end }}
  {{ end }}
</article>
{{ end }}
